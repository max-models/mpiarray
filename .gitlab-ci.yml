# GPU CI on gitlab.mpcdf.mpg.de. GitHub pushes every commit there to
# gpu-test-<branch> or gpu-test-pr-<number> (.github/workflows/gpu_ci_trigger.yml) and
# waits for this pipeline. The CPU jobs, docs and releases run on GitHub Actions.
variables:
  CUDA_IMAGE: "gitlab-registry.mpcdf.mpg.de/mpcdf/ci-module-image/nvhpcsdk_26:2026"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # every array on the GPU, through CuPy; fail instead of falling back to NumPy
  CUNUMPY_BACKEND: "cupy"
  CUNUMPY_REQUIRE_CUDA: "1"
  # the container may run as root; the tests start mpiexec
  OMPI_ALLOW_RUN_AS_ROOT: "1"
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"

stages:
  - test

.gpu_job:
  stage: test
  image: ${CUDA_IMAGE}
  tags:
    - gpu-nvidia
    - gpu-nvidia-cc80
  before_script:
    - module load python-waterboa/2025.06
    - module load nvhpcsdk/26
    - nvidia-smi
    # Keep NVRTC, CUDA libraries and headers on the same toolkit generation.
    - python3 -m pip install --user "cupy-cuda13x[ctk]" "cuda-toolkit==13.2.*"
    - python3 -m pip install --user -e ".[test]"
    - export PATH="$HOME/.local/bin:$PATH"
    - python3 -c "import cupy; cupy.show_config()"

# serially, on cunumpy's stand-in for mpi4py.MPI (mpi4py is not installed)
gpu_tests:
  extends: .gpu_job
  script:
    - python3 -c "import importlib.util as u; assert u.find_spec('mpi4py') is None"
    - python3 -m pytest -q -p no:cacheprovider

# under MPI, with mpi4py built against the MPI of the NVIDIA HPC SDK; device buffers
# are staged through host memory (mpiarray's default unless the program declares
# its MPI CUDA-aware)
gpu_tests_mpi:
  extends: .gpu_job
  script:
    - which mpicc mpiexec && mpiexec --version
    - python3 -m pip install --user --no-binary mpi4py mpi4py
    - for n in 2 4; do mpiexec --oversubscribe -n $n python3 -m pytest -q -p no:cacheprovider src/mpiarray/tests/unit || exit 1; done
