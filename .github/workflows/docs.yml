name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed notebooks and the API
# reference. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel.
# The guides run on 4 ranks (docs/package.json), so their plots show the rank boundaries;
# hence MPI and the mpi extra.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0.1.0
    with:
      apt-packages: "libopenmpi-dev openmpi-bin"
      extras: "docs mpi"
      smoke-paths: |
        getting-started/installation/index.html
        guides/distributed-arrays/index.html
        api/mpiarray/index.html
        api/mpiarray/distributed_array/index.html
        api/mpiarray/layout/index.html
        guides/layouts/index.html
        api/mpiarray/io/index.html
        guides/heat-equation/index.html
        guides/particles/index.html
        guides/working-with-data/index.html
        guides/units/index.html
