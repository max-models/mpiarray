name: Test Pytest

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

env:
  # A PR to main or a push to main (the release) uses PyPI versions only; devel uses the
  # devel branches from [tool.uv.sources].
  UV_NO_SOURCES: ${{ (github.base_ref || github.ref_name) == 'main' }}

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.mpi && 'with' || 'without' }} mpi4py)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # without mpi4py, mpiarray runs on maybempi's serial stand-in for mpi4py.MPI
        mpi: [false, true]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install MPI
        if: matrix.mpi
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install project
        run: uv sync --extra test ${{ matrix.mpi && '--extra mpi' || '' }}

      - name: Check that mpi4py is not installed
        if: ${{ !matrix.mpi }}
        run: uv run python -c "import importlib.util as u; assert u.find_spec('mpi4py') is None"

      - name: Run tests with coverage
        if: ${{ !matrix.mpi }}
        run: uv run pytest --cov --cov-report=xml --cov-report=term .

      # serially and on 2, 3, 4 and 6 ranks (some tests need exactly 2 or 6), with the
      # coverage of all runs combined, which must be at least 95%
      - name: Run tests serially and under MPI with coverage
        if: matrix.mpi
        run: |
          make coverage
          .venv/bin/python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}-${{ matrix.mpi && 'mpi' || 'serial' }}
          fail_ci_if_error: false

  # PyPI rejects a release whose metadata has a direct reference (name @ git+...), so a pull
  # request to main fails here instead of the release after the merge.
  no-direct-references:
    if: (github.base_ref || github.ref_name) == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Check that the wheel has no direct references (name @ git+...)
        run: |
          uv build --wheel -o dist
          if unzip -p dist/*.whl '*.dist-info/METADATA' | grep -E '^Requires-Dist: [^;]*@'; then
            echo "::error::Requires-Dist has a direct reference; use a version range and [tool.uv.sources]"
            exit 1
          fi
