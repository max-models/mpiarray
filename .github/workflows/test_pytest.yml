name: Test Pytest

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.mpi && 'with' || 'without' }} mpi4py)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # without mpi4py, mpiarray runs on cunumpy's serial stand-in for mpi4py.MPI
        mpi: [false, true]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install MPI
        if: matrix.mpi
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install project
        run: uv sync --extra test ${{ matrix.mpi && '--extra mpi' || '' }}

      - name: Check that mpi4py is not installed
        if: ${{ !matrix.mpi }}
        run: uv run python -c "import importlib.util as u; assert u.find_spec('mpi4py') is None"

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term .

      # some tests only run on exactly 2 or 6 ranks; the staging test starts its own 2-rank job
      - name: Run tests under MPI
        if: matrix.mpi
        run: |
          mpiexec -n 2 --oversubscribe .venv/bin/python -m pytest -q -p no:cacheprovider .
          mpiexec -n 6 --oversubscribe .venv/bin/python -m pytest -q -p no:cacheprovider .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}-${{ matrix.mpi && 'mpi' || 'serial' }}
          fail_ci_if_error: false
