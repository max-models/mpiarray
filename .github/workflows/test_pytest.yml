name: Test Pytest

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install MPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install project
        run: uv sync --extra test

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term .

      # some tests only run on exactly 2 or 6 ranks; the staging test starts its own 2-rank job
      - name: Run tests under MPI
        run: |
          mpiexec -n 2 --oversubscribe .venv/bin/python -m pytest -q -p no:cacheprovider .
          mpiexec -n 6 --oversubscribe .venv/bin/python -m pytest -q -p no:cacheprovider .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
