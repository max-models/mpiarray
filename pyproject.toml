[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "mpiarray"
version = "0.2.1"
description = "MPI domain decomposition and distributed NumPy/CuPy arrays with halo exchange."
readme = "README.md"
keywords = [ "array", "cupy", "domain decomposition", "halo exchange", "mpi", "numpy" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# only version ranges: PyPI rejects direct references (git URLs); devel takes the max-models
# packages from their devel branches, see [tool.uv.sources]
dependencies = [
  "cunumpy>=0.6.3",
  "maybempi>=0.1.2",
  "numpy",
]

optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "ty",
  "mpiarray[test,docs,mpi]",
]
optional-dependencies.docs = [
  "astropy",
  "h5py",
  "griffe",
  "ipykernel",
  "matplotlib",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "plasma-plots>=0.2.1",
  "xarray",
]
# without mpi4py, mpiarray runs serially on maybempi's stand-in for mpi4py.MPI
# HDF5 files: save_hdf5/load_hdf5 (parallel with an MPI-enabled h5py build)
optional-dependencies.hdf5 = [ "h5py" ]
optional-dependencies.mpi = [ "mpi4py" ]
# xarray interoperability (mpiarray.xarray): a gathered array as a labeled DataArray
optional-dependencies.units = [ "astropy" ]
optional-dependencies.xarray = [ "xarray" ]
# PETSc interoperability (mpiarray.petsc): DMDAs with a layout's decomposition
# matplotlib and nbformat: the guides are also run as tests, under MPI
optional-dependencies.test = [ "astropy", "h5py", "matplotlib", "nbformat>=5.10", "pytest", "pytest-cov", "xarray" ]
urls."Source" = "https://github.com/max-models/mpiarray"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
"*" = [ "py.typed" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
select = [ "B", "D", "E", "F", "I", "UP", "W" ]
ignore = [ "E501" ] # line length is handled by the formatter
pydocstyle.convention = "google"
per-file-ignores."**/tests/**" = [ "D" ]
per-file-ignores."*.ipynb" = [ "D" ]

[tool.pyright]
include = [ "src" ]
venvPath = "."
venv = ".venv"
exclude = [ "**/tests" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = [ "src" ]
testpaths = [ "src" ]
addopts = "-ra"

[tool.coverage.run]
source = [ "mpiarray" ]
# every `if` must be seen going both ways
branch = true
# mpiarray/petsc.py: CI has no petsc4py (it builds PETSc from source without a matching
# wheel), so its tests skip there; run them locally with petsc4py (see PETSC.md)
omit = [ "*/tests/*", "*/mpiarray/petsc.py" ]
# one data file per process (every MPI rank, and the jobs tests start), for `coverage combine`
parallel = true
patch = [ "subprocess" ]

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python = ".venv"
python-version = "3.10"

[tool.ty.src]
include = [ "src" ]

[tool.ty.analysis]
# CuPy and petsc4py are optional and not installed in CI
allowed-unresolved-imports = [ "cupy", "petsc4py" ]

# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
[tool.uv.sources]
cunumpy = { git = "https://github.com/max-models/cunumpy", branch = "devel" }
maybempi = { git = "https://github.com/max-models/maybempi", branch = "devel" }
plasma-plots = { git = "https://github.com/max-models/plasma-plots", branch = "devel" }
