[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "mpiarray"
version = "0.1.0"
description = "MPI domain decomposition and distributed NumPy/CuPy arrays with halo exchange."
readme = "README.md"
keywords = [ "array", "cupy", "domain decomposition", "halo exchange", "mpi", "numpy" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# cunumpy from its devel branch for now; PyPI rejects direct references, so switch
# to a version range ("cunumpy>=0.6") before a release
dependencies = [
  "cunumpy @ git+https://github.com/max-models/cunumpy.git@devel",
  "maybempi>=0.1.2",
  "numpy",
]

optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "ty",
  "mpiarray[test,docs,mpi]",
]
optional-dependencies.docs = [
  "griffe",
  "ipykernel",
  "matplotlib",
  "nbclient>=0.10",
  "nbformat>=5.10",
]
# without mpi4py, mpiarray runs serially on maybempi's stand-in for mpi4py.MPI
# HDF5 files: save_hdf5/load_hdf5 (parallel with an MPI-enabled h5py build)
optional-dependencies.hdf5 = [ "h5py" ]
optional-dependencies.mpi = [ "mpi4py" ]
# matplotlib and nbformat: the tutorials are also run as tests, under MPI
optional-dependencies.test = [ "h5py", "matplotlib", "nbformat>=5.10", "pytest", "pytest-cov" ]
urls."Source" = "https://github.com/max-models/mpiarray"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
"*" = [ "py.typed" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
select = [ "B", "D", "E", "F", "I", "UP", "W" ]
ignore = [ "E501" ] # line length is handled by the formatter
pydocstyle.convention = "google"
per-file-ignores."**/tests/**" = [ "D" ]
per-file-ignores."*.ipynb" = [ "D" ]
per-file-ignores."docs/tools/*" = [ "D" ]

[tool.pyright]
include = [ "src" ]
venvPath = "."
venv = ".venv"
exclude = [ "**/tests" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = [ "src" ]
testpaths = [ "src" ]
addopts = "-ra"

[tool.coverage.run]
source = [ "mpiarray" ]
# every `if` must be seen going both ways
branch = true
omit = [ "*/tests/*" ]
# one data file per process (every MPI rank, and the jobs tests start), for `coverage combine`
parallel = true
patch = [ "subprocess" ]

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python = ".venv"
python-version = "3.10"

[tool.ty.src]
include = [ "src" ]

[tool.ty.analysis]
# CuPy is optional and not installed in CI
allowed-unresolved-imports = [ "cupy" ]
